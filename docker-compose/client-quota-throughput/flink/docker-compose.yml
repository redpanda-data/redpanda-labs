name: client-quota-throughput-flink
networks:
  redpanda_network:
    driver: bridge
volumes:
  redpanda-0: null
services:
  redpanda-0:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.1}
    container_name: redpanda-0
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-latest}
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 8080:8080
    depends_on:
      redpanda-0:
        condition: service_healthy
  python-client:
    container_name: python-client
    image: python:3.11-slim
    command: ["/bin/bash", "-c", "pip install confluent-kafka && tail -f /dev/null"]
    environment:
      KAFKA_BROKERS: redpanda-0:9092
    volumes:
      - ./scripts:/scripts
    networks:
      - redpanda_network
    depends_on:
      redpanda-0:
        condition: service_healthy
  jobmanager:
    build: { context: ., dockerfile: Dockerfile }
    container_name: jobmanager
    command: jobmanager
    ports:
      - 8081:8081
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks:
      - redpanda_network
    depends_on:
      redpanda-0:
        condition: service_healthy
  taskmanager:
    build: { context: ., dockerfile: Dockerfile }
    container_name: taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 3
    networks:
      - redpanda_network
    depends_on:
      - jobmanager
  sql-client:
    build: { context: ., dockerfile: Dockerfile }
    container_name: sql-client
    command: ["/opt/flink/bin/sql-client.sh", "embedded"]
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    volumes:
      - ./sql:/etc/sql
    networks:
      - redpanda_network
    depends_on:
      - jobmanager
      - taskmanager

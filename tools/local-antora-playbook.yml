# Local and CI docs build for this repo.
#
#   npm run build     (antora --fetch tools/local-antora-playbook.yml --to-dir local-docs)
#   npm run serve
#
# Aggregates the private docs repos for xref resolution, so a GitHub token
# must be in ~/.git-credentials (Antora ignores git credential helpers). See
# CONTRIBUTING.md, "Build the docs locally".
site:
  title: Redpanda Docs
  start_page: solutions:ROOT:index.adoc
  url: http://localhost:5002
  robots: disallow
  keys:
    preview: true
urls:
  html_extension_style: indexify
  latest_version_segment: 'current'
output:
  clean: true
runtime:
  log:
    # Only fatal problems (an unreachable content source, an invalid playbook,
    # a failed solutions-catalog validation) fail the build. This playbook
    # aggregates repositories this one does not control, so an error-level
    # issue in their content should not fail a solutions build. Errors are
    # still logged.
    failure_level: fatal
content:
  sources:
  # This repository. ~+ is Antora's token for the working directory, so run the
  # build from the repo root (npm run build does); a plain relative path would
  # resolve against the playbook's directory (tools/). A linked git worktree
  # is not accepted as a local content source: build from a normal clone.
  # Two start paths of one repo are one clone: the new solutions component and
  # the frozen labs component.
  - url: ~+
    branches: HEAD
    start_paths: [docs, labs-docs]
  - url: https://github.com/redpanda-data/docs
    branches: [main, v/*, site-search]
  - url: https://github.com/redpanda-data/docs
    branches: main
    start_path: shared
  - url: https://github.com/redpanda-data/rp-connect-docs
    branches: [main]
  - url: https://github.com/redpanda-data/docs-site
    branches: 'main'
    start_paths: [home, data-platform, self-managed]
  - url: https://github.com/redpanda-data/cloud-docs
    branches: [main]
ui:
  bundle:
    url: https://github.com/redpanda-data/docs-ui/releases/latest/download/ui-bundle.zip
    snapshot: true
asciidoc:
  attributes:
  extensions:
  - '@asciidoctor/tabs'
  - '@redpanda-data/docs-extensions-and-macros/macros/rp-connect-components'
  - '@redpanda-data/docs-extensions-and-macros/macros/glossary'
  - '@redpanda-data/docs-extensions-and-macros/macros/config-ref'
  - '@redpanda-data/docs-extensions-and-macros/macros/helm-ref'
  - '@redpanda-data/docs-extensions-and-macros/asciidoc-extensions/add-line-numbers-highlights'
antora:
  extensions:
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/conditional-home-redirect'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/unified-navigation'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/generate-rp-connect-info'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/unpublish-pages'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/add-global-attributes'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/version-fetcher/set-latest-version'
  # solutions-catalog validates the metadata contract, derives step navigation,
  # and writes assets/data/solutions.json. Register it directly before
  # validate-attributes. Activate this line once docs-extensions-and-macros
  # 5.40.0 is published to npm and the dependency in package.json is bumped.
  # - require: '@redpanda-data/docs-extensions-and-macros/extensions/solutions-catalog/index'
  #   max_related: 3
  #   min_score: 0.3
  #   network_checks: auto
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/validate-attributes'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/generate-index-data'
    data:
      sets:
        docker_labs:
          component: labs
          family: page
          filter: docker-compose
          env_type: Docker
          attribute_name: docker-labs-index
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/archive-attachments'
    data:
      archives:
        - component: 'streaming'
          output_archive: 'redpanda-quickstart.tar.gz'
          file_patterns:
            - '**/test-resources/**/docker-compose/**'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/replace-attributes-in-attachments'
    data:
      replacements:
        - components:
            - 'streaming'
            - 'labs'
          file_patterns:
            - '**/docker-compose.yaml'
            - '**/docker-compose.yml'
  - require: '@sntke/antora-mermaid-extension'
    mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs
    script_stem: mermaid-scripts
    mermaid_initialize_options:
      start_on_load: true
      theme: base
      theme_variables:
        line_color: '#e2401b'
        font_family: Inter, sans-serif
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/algolia-indexer/index'
    excludes: ['.thumbs','script', '.page-versions','.feedback-section','.banner-container']
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/collect-bloblang-samples'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/generate-rp-connect-categories'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/modify-redirects'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/unlisted-pages'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/find-related-docs'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/find-related-labs'
  - require: '@redpanda-data/docs-extensions-and-macros/extensions/aggregate-terms'

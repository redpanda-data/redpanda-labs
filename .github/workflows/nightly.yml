# Runs every solution against the latest Redpanda, Console, and Connect images
# through its generated Doc Detective specs, opens (or updates) one issue when
# anything fails, and opens a pull request when the run regenerated the media
# the pages show (screenshots and recordings are captured by the tests, never
# edited by hand).
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # The report job lists this run's jobs to name the failed solutions.
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.set.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          slugs=$(tools/changed-solutions.sh --all)
          echo "slugs=$slugs" | tee -a "$GITHUB_OUTPUT"

  solution:
    needs: matrix
    if: needs.matrix.outputs.slugs != '[]'
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.matrix.outputs.slugs) }}
    uses: ./.github/workflows/test-solution.yml
    with:
      slug: ${{ matrix.slug }}
      latest-images: true
      doc-detective: true

  # Every solution job uploads a media-<slug> artifact when its Doc Detective
  # run changed docs/modules/<slug>/images. Put them back into a checkout and
  # open one pull request for the lot.
  media:
    needs: [matrix, solution]
    if: always() && needs.matrix.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: media-*
          path: ${{ runner.temp }}/media
      - name: Place the regenerated media
        id: place
        run: |
          slugs=""
          for d in "$RUNNER_TEMP"/media/media-*; do
            [ -d "$d" ] || continue
            slug=${d##*/media-}
            mkdir -p "docs/modules/$slug/images"
            cp -R "$d"/. "docs/modules/$slug/images/"
            slugs="$slugs $slug"
          done
          if [ -n "$(git status --porcelain docs/modules/*/images)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "slugs=$(echo $slugs | tr ' ' ',')" >> "$GITHUB_OUTPUT"
            git status --porcelain docs/modules/*/images
          fi
      - name: Open the media pull request
        if: steps.place.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: nightly/refresh-media
          title: "Refresh generated media for ${{ steps.place.outputs.slugs }}"
          commit-message: "Refresh generated media for ${{ steps.place.outputs.slugs }}"
          body: |
            The nightly Doc Detective run regenerated the screenshots or recordings under `docs/modules/*/images` for: ${{ steps.place.outputs.slugs }}.

            Media is captured by the tests, never edited by hand. Review the images, then merge.
          add-paths: docs/modules/*/images/*
          delete-branch: true

  report:
    needs: [matrix, solution]
    if: always() && needs.matrix.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        env:
          SOLUTION_RESULT: ${{ needs.solution.result }}
        with:
          script: |
            const title = 'Nightly solutions run failed';
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            // Reusable-workflow matrix jobs are named "solution (<slug>) / <slug>".
            const failed = jobs
              .filter((j) => j.conclusion === 'failure' && /^solution \(/.test(j.name))
              .map((j) => (j.name.match(/^solution \(([^)]+)\)/) || [])[1])
              .filter(Boolean);

            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 10 });
            const existing = open.data.find((i) => i.title === title);

            if (process.env.SOLUTION_RESULT === 'success') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `Nightly run passed again: ${runUrl}. Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }

            const date = new Date().toISOString().slice(0, 10);
            const list = failed.length ? failed.map((s) => `- \`${s}\``).join('\n') : '- (see the run for details)';
            const body = [
              `The nightly run on ${date} failed against the latest images.`,
              '',
              'Failed solutions:',
              list,
              '',
              `Run: ${runUrl}`,
              '',
              'Each failed job uploads a `logs-<slug>-latest` artifact with `docker compose ps` and the service logs.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: 'B60205',
                  description: 'Opened by the nightly workflow' });
              } catch (e) { /* label exists */ }
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }

# Validates the docs side of a PR: the metadata contract, a real Antora build
# with the same extensions production uses, Doc Detective for the solutions
# the PR touched, and an offline link check of the built site.
name: docs

# No paths filter: this is a required check, so it must always run. The
# Doc Detective matrix is empty when no solution changed.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Actions token cannot read the private docs repos this build aggregates
  # (docs, cloud-docs, rp-connect-docs, docs-site). REDPANDA_GITHUB_TOKEN is a
  # fine-grained token with contents: read on those repos. Until it is set the
  # build falls back to GITHUB_TOKEN, which is enough while every repo it
  # touches is public.
  DOCS_READ_TOKEN: ${{ secrets.REDPANDA_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the metadata contract
        env:
          GITHUB_TOKEN: ${{ env.DOCS_READ_TOKEN }}
        run: tools/check-metadata.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Git credentials for Antora
        # Antora ignores git credential helpers; it reads ~/.git-credentials.
        run: |
          echo "https://${DOCS_READ_TOKEN}:@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
      - name: Build the site
        env:
          SOLUTIONS_INCLUDE_DRAFTS: 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee antora.log
      - name: Remove git credentials
        if: always()
        run: rm -f ~/.git-credentials
      - name: Fail on unresolved includes and missing images
        # Antora logs these at error level and, with failure_level fatal, still
        # exits 0. A page that lost its include or diagram must not merge.
        run: |
          if grep -E 'Unresolved (include|directive)|target of image not found|include file not found' antora.log; then
            echo "::error::the Antora build logged unresolved includes or missing images (see above)"
            exit 1
          fi
          echo "no unresolved includes or missing images"
      - name: Check links offline
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/local-docs
            --fallback-extensions html
            --exclude-path 'local-docs/labs'
            'local-docs/solutions/**/*.html'
          fail: true
      - name: Upload the built site
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: local-docs
          retention-days: 3

  matrix:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.set.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set
        run: |
          slugs=$(tools/changed-solutions.sh "origin/${{ github.base_ref }}")
          echo "slugs=$slugs" | tee -a "$GITHUB_OUTPUT"

  doc-detective:
    needs: [metadata, matrix]
    if: needs.matrix.outputs.slugs != '[]'
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.matrix.outputs.slugs) }}
    name: doc-detective (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raise the AIO limit
        run: sudo sysctl -w fs.aio-max-nr=1048576
      - name: Install a virtual display
        # The virtual display the recording needs, and the reason it is not
        # optional. doc-detective resolves a record step's engine from the
        # context rather than from the spec: headed Chrome gets the browser
        # engine, which captures the tab; anything headless gets the ffmpeg
        # engine, which captures a screen. A record step on a headless context
        # does not fall back, it SKIPS, with "Recording isn't supported in
        # headless mode with the browser engine" (verified against 4.38.1).
        # The generated spec therefore pins headed Chrome, headed Chrome needs
        # a display, and a runner has none. A skipped spec is also why
        # tools/run-doc-detective.sh treats SKIPPED as a failure: without that,
        # a run with no display would report success having recorded nothing.
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      # doc-detective lazily installs its runtime packages, browser binaries
      # and ffmpeg on first use: about 1.3 GB, and by default into a temp
      # directory the runner throws away, so every run downloads the lot
      # again. DOC_DETECTIVE_CACHE_DIR moves it into the workspace where
      # actions/cache can carry it between runs. The engine version decides
      # what belongs in there, so it is the whole cache key; read from the
      # runner script rather than repeated here, because a bumped pin must not
      # silently reuse the old cache.
      - name: Point the doc-detective cache at the workspace
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^DD_VERSION=\$\{DD_VERSION:-([0-9.]+)\}.*/\1/p' tools/run-doc-detective.sh)
          [ -n "$version" ] || { echo "::error::could not read DD_VERSION from tools/run-doc-detective.sh"; exit 1; }
          echo "DD_VERSION=$version" >> "$GITHUB_ENV"
          echo "DOC_DETECTIVE_CACHE_DIR=$GITHUB_WORKSPACE/.doc-detective-cache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.doc-detective-cache
          key: doc-detective-cache-${{ runner.os }}-${{ env.DD_VERSION }}

      # Downloads anything the cache did not restore, before the suite starts,
      # so a cache miss shows up as its own step rather than as a slow first
      # spec. `install all` covers the runtime packages and the browsers;
      # agents and the mobile toolchains are deliberately not included.
      - name: Pre-warm the doc-detective cache
        run: npx --yes "doc-detective@$DD_VERSION" install all --yes
      - name: Run the step specs
        run: xvfb-run -a -s "-screen 0 1280x800x24" tools/run-doc-detective.sh "${{ matrix.slug }}"
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doc-detective-${{ matrix.slug }}
          path: |
            solutions/${{ matrix.slug }}/testResults-*.json
            solutions/${{ matrix.slug }}/doc-detective-output
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        working-directory: solutions/${{ matrix.slug }}
        run: docker compose down -v --remove-orphans || true

  # Single required check for branch protection.
  docs:
    needs: [metadata, build, matrix, doc-detective]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "metadata: ${{ needs.metadata.result }}, build: ${{ needs.build.result }}, doc-detective: ${{ needs.doc-detective.result }}"
          [ "${{ needs.metadata.result }}" = "success" ] || exit 1
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          case "${{ needs.doc-detective.result }}" in success|skipped) ;; *) exit 1 ;; esac

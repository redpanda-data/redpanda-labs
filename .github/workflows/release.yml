# Publishes a bundle for every solution whose authored version has no release
# yet, then triggers the docs site build. This is the only Netlify trigger:
# every run on main posts the hook once at the end, so a docs change without
# a version bump still rebuilds the site.
#
# For each docs/modules/<slug>/pages/index.adoc with :page-solution-version:
# vX.Y.Z, status published or deprecated, and no GitHub Release <slug>/vX.Y.Z:
# zip solutions/<slug> (plus LICENSE and tools/verify-lib.sh) as
# <slug>-vX.Y.Z.zip and create the release with `gh release create`, which
# creates the tag at the merged commit. Drafts are never released, so a
# version is first released when the solution is published. Nothing is
# tagged by hand, and no tag exists without its release: the "already
# released" test is the release itself, so a failed run can be re-run.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Not a secret: it can only start a build.
  NETLIFY_BUILD_HOOK: https://api.netlify.com/build_hooks/65c0cd2e63853f0b159cdbc6

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release new versions
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          attr() { sed -nE "s/^:$2:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p" "$1" | head -1; }

          released=0
          for overview in docs/modules/*/pages/index.adoc; do
            [ -f "$overview" ] || continue
            slug=$(basename "$(dirname "$(dirname "$overview")")")
            case "$slug" in ROOT|examples) continue ;; esac
            [ -d "solutions/$slug" ] || { echo "::notice::$slug has no solutions/$slug directory; skipped"; continue; }

            status=$(attr "$overview" page-solution-status)
            case "$status" in
              published|deprecated) ;;
              *) echo "$slug is $status; not released"; continue ;;
            esac

            version=$(attr "$overview" page-solution-version)
            if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning file=$overview::page-solution-version '$version' is not vX.Y.Z; skipped"
              continue
            fi

            tag="$slug/$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released"
              continue
            fi

            name="$slug-$version"
            stage=$(mktemp -d)
            mkdir -p "$stage/$name/scripts"
            git archive --format=tar "HEAD:solutions/$slug" | tar -x -C "$stage/$name"
            cp LICENSE "$stage/$name/LICENSE"
            cp tools/verify-lib.sh "$stage/$name/scripts/verify-lib.sh"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$name.zip" "$name")
            rm -rf "$stage"

            # Extra flags per status go here; the expansion below is safe when empty.
            flags=()
            gh release create "$tag" "$name.zip" \
              --target "$GITHUB_SHA" \
              --title "$slug $version" \
              --latest=false \
              --notes "Bundle for the $slug solution, $version ($status). Docs: https://docs.redpanda.com/solutions/$slug/" \
              ${flags[@]+"${flags[@]}"}
            echo "released $tag with $name.zip"
            released=$((released + 1))
          done
          echo "count=$released" | tee -a "$GITHUB_OUTPUT"

      - name: Trigger the docs site build
        if: always()
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

# Publishes a bundle for every solution whose authored version has no tag yet.
#
# For each docs/modules/<slug>/pages/index.adoc with :page-solution-version:
# vX.Y.Z and no tag <slug>/vX.Y.Z: zip solutions/<slug> (plus LICENSE and
# tools/verify-lib.sh) as <slug>-vX.Y.Z.zip, create the annotated tag and a
# GitHub Release with the asset, then trigger one Netlify build so the docs
# site sees the release. Nothing is tagged by hand.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Same hook as build-docs.yml. Not a secret: it can only start a build.
  NETLIFY_BUILD_HOOK: https://api.netlify.com/build_hooks/65c0cd2e63853f0b159cdbc6

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release new versions
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          attr() { sed -nE "s/^:$2:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p" "$1" | head -1; }

          released=0
          for overview in docs/modules/*/pages/index.adoc; do
            [ -f "$overview" ] || continue
            slug=$(basename "$(dirname "$(dirname "$overview")")")
            [ "$slug" = "ROOT" ] && continue
            [ -d "solutions/$slug" ] || { echo "::notice::$slug has no solutions/$slug directory; skipped"; continue; }

            version=$(attr "$overview" page-solution-version)
            if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning file=$overview::page-solution-version '$version' is not vX.Y.Z; skipped"
              continue
            fi
            status=$(attr "$overview" page-solution-status)
            tag="$slug/$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
              continue
            fi

            name="$slug-$version"
            stage=$(mktemp -d)
            mkdir -p "$stage/$name/scripts"
            git archive --format=tar "HEAD:solutions/$slug" | tar -x -C "$stage/$name"
            cp LICENSE "$stage/$name/LICENSE"
            cp tools/verify-lib.sh "$stage/$name/scripts/verify-lib.sh"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/$name.zip" "$name")
            rm -rf "$stage"

            git tag -a "$tag" -m "$slug $version" HEAD
            git push origin "refs/tags/$tag"

            flags=()
            [ "$status" = "published" ] || flags+=(--prerelease)
            gh release create "$tag" "$name.zip" \
              --title "$slug $version" \
              --notes "Bundle for the $slug solution, $version ($status). Docs: https://docs.redpanda.com/solutions/$slug/" \
              "${flags[@]}"
            echo "released $tag with $name.zip"
            released=$((released + 1))
          done
          echo "count=$released" | tee -a "$GITHUB_OUTPUT"

      - name: Trigger the docs site build
        if: steps.release.outputs.count != '0'
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"

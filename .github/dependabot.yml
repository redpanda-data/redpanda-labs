version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Per-solution code. Add entries when the first solution lands, using
  # directory globs so no solution is listed by hand, for example:
  #
  #   - package-ecosystem: docker
  #     directories: ["/solutions/*", "/solutions/*/services/*"]
  #     schedule: { interval: weekly }
  #   - package-ecosystem: docker-compose
  #     directories: ["/solutions/*"]
  #     schedule: { interval: weekly }
  #   - package-ecosystem: gomod
  #     directories: ["/solutions/*/services/*"]
  #     schedule: { interval: weekly }
  #
  # They are left out until then: a glob that matches no manifest makes
  # Dependabot report an error for the whole update run.

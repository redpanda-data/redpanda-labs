version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Per-solution code. Directory globs match every solution without listing
  # them; an ecosystem with no matching manifest is skipped.
  - package-ecosystem: docker
    directories: ["/solutions/*", "/solutions/*/services/*"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ["/solutions/*"]
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories: ["/solutions/*", "/solutions/*/services/*"]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories: ["/solutions/*/services/*"]
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories: ["/solutions/*", "/solutions/*/services/*"]
    schedule:
      interval: weekly

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-iceberg
  namespace: iceberg-lab
  labels:
    app: spark-iceberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-iceberg
  template:
    metadata:
      labels:
        app: spark-iceberg
    spec:
      # Share /etc/hosts volume between init container and main container
      volumes:
      - name: hosts-volume
        emptyDir: {}
      # spark-defaults.conf and the notebook, from the spark-files ConfigMap
      - name: spark-files
        configMap:
          name: spark-files
      # Writable copy of the notebook, so Jupyter can save it
      - name: notebooks
        emptyDir: {}

      # Init container resolves RustFS IP and configures DNS
      initContainers:
      - name: dns-resolver
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Resolving RustFS service IP..."

          # Get RustFS service IP (try ClusterIP first, then Pod IP)
          S3_IP=$(nslookup rustfs.iceberg-lab.svc.cluster.local | grep 'Address:' | tail -1 | awk '{print $2}')

          if [ -z "$S3_IP" ]; then
            echo "ClusterIP not found, trying pod IP..."
            # For headless services, get pod IP directly
            S3_IP=$(nslookup rustfs.iceberg-lab.svc.cluster.local | grep -A 1 'Name:' | grep 'Address:' | head -1 | awk '{print $2}')
          fi

          if [ -z "$S3_IP" ]; then
            echo "ERROR: Could not resolve RustFS IP"
            exit 1
          fi

          echo "RustFS IP resolved: $S3_IP"

          # Copy original /etc/hosts
          cp /etc/hosts /shared/hosts

          # Add bucket-style hostname mappings
          echo "$S3_IP redpanda.rustfs.iceberg-lab.svc.cluster.local" >> /shared/hosts
          echo "$S3_IP lab.redpanda.rustfs.iceberg-lab.svc.cluster.local" >> /shared/hosts
          echo "$S3_IP redpanda.rustfs" >> /shared/hosts

          echo "DNS mappings configured:"
          cat /shared/hosts | tail -3

          cp /spark-files/query-redpanda-table.ipynb /notebooks/
          chmod 666 /notebooks/query-redpanda-table.ipynb
        volumeMounts:
        - name: hosts-volume
          mountPath: /shared
        - name: spark-files
          mountPath: /spark-files
        - name: notebooks
          mountPath: /notebooks

      # Schedule on dedicated Spark worker node for performance isolation
      # Prevents interference from other workloads
      nodeSelector:
        kubernetes.io/hostname: kind-worker
      # Tolerate the dedicated taint on Spark worker node
      # This ensures only Spark workloads run on the designated node
      tolerations:
        - key: dedicated
          operator: Equal
          value: spark
          effect: NoSchedule

      containers:
      - name: spark
        # Jupyter with PySpark, from the Jupyter Docker Stacks. The Iceberg
        # jars are fetched from Maven when the first Spark session starts.
        image: quay.io/jupyter/pyspark-notebook:spark-4.1.2
        command: ["start-notebook.py", "--IdentityProvider.token=", "--ServerApp.root_dir=/home/jovyan/notebooks"]
        ports:
        - containerPort: 8888

        # Use the hosts file configured by init container
        volumeMounts:
        - name: hosts-volume
          mountPath: /etc/hosts
          subPath: hosts
        - name: spark-files
          mountPath: /usr/local/spark/conf/spark-defaults.conf
          subPath: spark-defaults.conf
        - name: notebooks
          mountPath: /home/jovyan/notebooks

        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: redpanda-secret
              key: cloud_storage_access_key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: redpanda-secret
              key: cloud_storage_secret_key
        - name: AWS_REGION
          value: local

        livenessProbe:
          httpGet:
            path: /api
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /api
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10

        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

---
apiVersion: v1
kind: Service
metadata:
  name: spark-iceberg
  namespace: iceberg-lab
  labels:
    app: spark-iceberg
spec:
  selector:
    app: spark-iceberg
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: jupyter
  type: ClusterIP

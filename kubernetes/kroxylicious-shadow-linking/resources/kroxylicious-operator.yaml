---
# The Deployment for the operator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kroxylicious-operator
  namespace: kroxylicious-operator
  labels:
    app.kubernetes.io/name: kroxylicious
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kroxylicious
  template:
    metadata:
      labels:
        app: kroxylicious
    spec:
      serviceAccountName: kroxylicious-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: quay.io/kroxylicious/operator:0.24.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: KUBERNETES_USER_AGENT
              value: "kroxylicious-operator/0.24.0"
            # Demo addition: use our custom proxy image (built from kroxylicious/topic-prefixer/)
            # instead of the stock quay.io/kroxylicious/proxy image, so KafkaProxy pods get our
            # topic-prefixer filter on their classpath. See ProxyDeploymentDependentResource in the
            # operator source for this env var.
            - name: KROXYLICIOUS_IMAGE
              value: "kroxylicious-shadow-demo-proxy:0.24.0"
          args: [ ]
          resources:
            requests:
              memory: 512Mi
              cpu: "1"
            limits:
              memory: 512Mi
              cpu: "1"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
            httpGet:
              port: http
              path: /livez


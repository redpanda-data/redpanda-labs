                      protocols:
                        description: |
                          Reconciled TLS protocols configuration.
                          This is copied from spec.tls.protocols during reconciliation.
                        type: object
                        properties:
                          allow:
                            description: The TLS protocols to allow, ordered by preference.
                            type: array
                            items:

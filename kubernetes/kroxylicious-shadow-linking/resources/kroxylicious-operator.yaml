#
# Vendored from the kroxylicious-operator-0.24.0 release artifact's `install/` directory
# (https://github.com/kroxylicious/kroxylicious/releases/tag/v0.24.0), concatenated into a single
# file for convenience, with one addition: a KROXYLICIOUS_IMAGE env var on the operator Deployment
# (near the bottom of this file) so it deploys our custom proxy image - see kroxylicious/topic-prefixer/.

# Note the v1 in the filename refers to the version of the CustomResourceDefinition
# not any of the versions of API being defined.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: kafkaproxies.kroxylicious.io
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: kroxylicious.io
  scope: Namespaced
  names:
    plural: kafkaproxies
    singular: kafkaproxy
    kind: KafkaProxy
    shortNames:
      - kp
    categories:
      - kroxylicious
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: { }
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
      additionalPrinterColumns:
        - name: Ready
          description: Whether the other resources referenced by this proxy can be found.
          jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
          type: string
          priority: 0
      schema:
        openAPIV3Schema:
          type: object
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 50
                  pattern: "[a-z0-9]([a-z0-9-]*[a-z0-9])?"
            spec:
              type: object
              properties:
                infrastructure:
                  type: object
                  description: |
                    A collection of infrastructure-level settings that may be applied across all (or a subset of) 
                    manifested resources for a KafkaProxy. This includes settings that affect resource behaviour at
                    the platform layer, such as:
                    - Resource limits and requests
                  properties:
                    proxyContainer:
                      description: |
                        infrastructure-level settings applied to proxy containers
                      type: object
                      properties:
                        resources:
                          type: object
                          description: "A specification for the compute/memory requirements of the proxy container."
                          properties:
                            limits:
                              description: "Limits describes the maximum amount of each resource allowed."
                              properties:
                                cpu:
                                  description: "The maximum compute allowed"
                                  anyOf:
                                    - type: integer
                                    - type: string
                                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                                  x-kubernetes-int-or-string: true
                                memory:
                                  description: "The maximum memory allowed"
                                  anyOf:
                                    - type: integer
                                    - type: string
                                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                                  x-kubernetes-int-or-string: true
                              type: object
                            requests:
                              type: object
                              description: |
                                Requests describes the minimum amount of each resources required. If
                                Requests is omitted for a container, it defaults to Limits if that is
                                explicitly specified, otherwise to an implementation-defined value.
                              properties:
                                cpu:
                                  description: "The minimum compute required"
                                  anyOf:
                                    - type: integer
                                    - type: string
                                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                                  x-kubernetes-int-or-string: true
                                memory:
                                  description: "The minimum memory required"
                                  anyOf:
                                    - type: integer
                                    - type: string
                                  pattern: "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
                                  x-kubernetes-int-or-string: true
                network:
                  type: object
                  description: |
                    Controls Netty-level network settings for the proxy. All fields are optional;
                    omitting a field leaves the proxy default in effect.
                    Durations use Go-style format: e.g. "30s", "5m".
                  properties:
                    proxy:
                      type: object
                      description: Netty settings for the proxy (client-facing) channel.
                      properties:
                        workerThreadCount:
                          type: integer
                          format: int32
                          minimum: 1
                          description: |
                            Number of Netty worker threads for the proxy channel.
                            Defaults to 2 * available processors.
                        shutdownQuietPeriod:
                          type: string
                          pattern: "^([0-9]+(m|s|ms|us|\u03bcs|ns))+$"
                          description: |
                            The quiet period used during graceful shutdown of the proxy channel's
                            event loop. During this period the event loop continues to accept and
                            process tasks; if no tasks arrive within this period, shutdown proceeds.
                            Go-style duration (e.g. "2s").
                        shutdownTimeout:
                          type: string
                          pattern: "^([0-9]+(m|s|ms|us|\u03bcs|ns))+$"
                          description: |
                            The maximum time to wait for the proxy channel's event loop to shut
                            down gracefully. If shutdown does not complete within this period,
                            it is forced. Go-style duration (e.g. "15s"). Defaults to 15s.
                        authenticatedIdleTimeout:
                          type: string
                          pattern: "^([0-9]+(m|s|ms|us|\u03bcs|ns))+$"
                          description: |
                            Maximum time a connection may remain idle after authentication
                            before being closed by the proxy. Go-style duration (e.g. "10m").
                        unauthenticatedIdleTimeout:
                          type: string
                          pattern: "^([0-9]+(m|s|ms|us|\u03bcs|ns))+$"
                          description: |
                            Maximum time a connection may remain idle without completing
                            authentication before being closed. Go-style duration (e.g. "10s").
                    management:
                      type: object
                      description: Netty settings for the management (admin/metrics) channel.
                      properties:
                        workerThreadCount:
                          type: integer
                          format: int32
                          minimum: 1
                          description: |
                            Number of Netty worker threads for the management channel.
                            Defaults to 2 * available processors.
                        shutdownQuietPeriod:
                          type: string
                          pattern: "^([0-9]+(m|s|ms|us|\u03bcs|ns))+$"
                          description: |
                            The quiet period used during graceful shutdown of the management
                            channel's event loop. Go-style duration (e.g. "2s").
                        shutdownTimeout:
                          type: string
                          pattern: "^([0-9]+(m|s|ms|us|\u03bcs|ns))+$"
                          description: |
                            The maximum time to wait for the management channel's event loop to
                            shut down gracefully. If shutdown does not complete within this
                            period, it is forced. Go-style duration (e.g. "15s"). Defaults to 15s.
                replicas:
                  description: "The number of pods to deploy."
                  type: integer
                  format: int32
                  minimum: 0
                  default: 1
            status:
              type: object
              properties:
                observedGeneration:
                  description: |
                    The metadata.generation that was observed during the last reconciliation by the operator.
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        description: |
                          lastTransitionTime is the last time the condition transitioned from one status to another. 
                          This should be when the underlying condition changed. 
                          If that is not known, then using the time when the API field changed is acceptable.
                        type: string
                        format: date-time
                      message:
                        description: |
                          message is a human readable message indicating details about the transition. 
                          This may be an empty string.
                        type: string
                        default: ""
                        nullable: false
                      observedGeneration:
                        description: |
                          observedGeneration represents the .metadata.generation that the condition was set based upon. 
                          For instance, if .metadata.generation is currently 12, but the 
                          .status.conditions[x].observedGeneration is 9, the condition is out of date with 
                          respect to the current state of the instance.
                        type: integer
                        nullable: false
                      reason:
                        description: |
                          reason contains a programmatic identifier indicating the reason for the condition's last transition. 
                          Producers of specific condition types may define expected values and meanings for this field, 
                          and whether the values are considered a guaranteed API. 
                          The value should be a CamelCase string. 
                          This field may not be empty.
                        type: string
                        default: ""
                        nullable: false
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                        enum: [ "True", "False", "Unknown" ]
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - observedGeneration
                      - reason
                      - message
                      - type
                clusters:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [ "name" ]
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name:
                        description: The name of the `spec.cluster`.
                        type: string
                      conditions:
                        description: The conditions associated with this cluster.
                        type: array
                        items:
                          type: object
                          properties:
                            lastTransitionTime:
                              description: |
                                lastTransitionTime is the last time the condition transitioned from one status to another. 
                                This should be when the underlying condition changed. 
                                If that is not known, then using the time when the API field changed is acceptable.
                              type: string
                              format: date-time
                            message:
                              description: |
                                message is a human readable message indicating details about the transition. 
                                This may be an empty string.
                              type: string
                            observedGeneration:
                              description: |
                                observedGeneration represents the .metadata.generation that the condition was set based upon. 
                                For instance, if .metadata.generation is currently 12, but the 
                                .status.conditions[x].observedGeneration is 9, the condition is out of date with 
                                respect to the current state of the instance.
                              type: integer
                            reason:
                              description: |
                                reason contains a programmatic identifier indicating the reason for the condition's last transition. 
                                Producers of specific condition types may define expected values and meanings for this field, 
                                and whether the values are considered a guaranteed API. 
                                The value should be a CamelCase string. 
                                This field may not be empty.
                              type: string
                            status:
                              description: status of the condition, one of True, False, Unknown.
                              type: string
                              enum: [ "True", "False", "Unknown" ]
                            type:
                              description: type of condition in CamelCase or in foo.example.com/CamelCase.
                              type: string
                replicas:
                  description: "The number of instances of the proxy pods that have reported ready."
                  type: integer
                  format: int32
          required: [] # (Deprecated) absent spec is treated as if it were present and empty

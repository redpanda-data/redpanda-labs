# Note the v1 in the filename refers to the version of the CustomResourceDefinition
# not any of the versions of API being defined.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: kafkaservices.kroxylicious.io
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: kroxylicious.io
  scope: Namespaced
  names:
    plural: kafkaservices
    singular: kafkaservice
    kind: KafkaService
    shortNames:
      - ks
    categories:
      - kroxylicious
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: { }
      additionalPrinterColumns:
        - jsonPath: ".status.conditions[?(@.type==\"ResolvedRefs\")].status"
          description: Whether the other resources referenced by this service can be found.
          type: string
          name: ResolvedRefs
          priority: 0
      schema:
        openAPIV3Schema:
          type: object
          properties:
            metadata:
              type: object
            spec:
              type: object
              oneOf:
                - required: [ "strimziKafkaRef" ]
                - required: [ "bootstrapServers" ]
              properties:
                strimziKafkaRef:
                  description: Reference to a Strimzi Kafka resource that declares the Kafka Cluster to be proxied.
                  type: object
                  properties:
                    kind:
                      description: The API kind of the resource
                      type: string
                      default: Kafka
                    group:
                      description: The API group of the resource
                      type: string
                      default: "kafka.strimzi.io"
                    name:
                      description: Name of the cluster
                      type: string
                    namespace:
                      description: Namespace of the Kafka cluster. Defaults to the KafkaService namespace.
                      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                    listenerName:
                      description: listener name of the cluster
                      type: string
                    trustStrimziCaCertificate:
                      description: |
                        If true, automatically trust the Strimzi cluster CA certificate for TLS connections
                        to the upstream Kafka cluster. The proxy will discover the CA certificate from the
                        Secret created by Strimzi (<kafka-name>-cluster-ca-cert in the same namespace as the referenced Kafka CR).

                        Security note: This delegates certificate trust to the Strimzi operator.
                      type: boolean
                  required:
                    - name
                    - listenerName
                bootstrapServers:
                  description: Bootstrap servers of the Kafka cluster.
                  type: string
                  minLength: 1
                  pattern: ^(([^:]+:[0-9]{1,5}),)*([^:]+:[0-9]{1,5})$
                tls:
                  description: Configuration for TLS connections made to the Kafka cluster.
                  type: object
                  properties:
                    certificateRef:
                      description: |
                        A reference to a resource holding the TLS client certificate to be used when 
                        connecting to the Kafka cluster. 
                        
                        When the resource is of `kind: Secret` it is expected to have `type: kubernetes.io/tls` with 
                        keys `tls.key` and `tls.crt`. See https://kubernetes.io/docs/concepts/configuration/secret/#tls-secrets.
                      type: object
                      required: [ "name" ]
                      properties:
                        kind:
                          description: The API kind of the resource containing the TLS client certificate.
                          type: string
                          default: Secret
                        group:
                          description: The API group of the resource containing the TLS client certificate.
                          type: string
                          default: ""
                        name:
                          description: The name of the resource containing the TLS client certificate.
                          type: string
                    trustAnchorRef:
                      description: |
                        A reference to a resource holding the trusted CA certificates for validation of
                        a Kafka broker's TLS server certificate.
                        If not specified the system will use the trust store inherited from the JVM that the
                        proxy runs on.
                      type: object
                      required: [ "name", "key" ]
                      properties:
                        kind:
                          description: The API kind of the resource containing the trusted CA certificates.
                          type: string
                          default: ConfigMap
                        group:
                          description: The API group of the resource containing the trusted CA certificates.
                          type: string
                          default: ""
                        storeType:
                          description: The format of the key store containing the trusted CA certificates.
                          type: string
                          enum:
                            - PEM
                            - JKS
                            - PKCS12
                        name:
                          description: The name of the resource containing the trusted CA certificates.
                          type: string
                        key:
                          description: | 
                            The name of the key identifying the trusted CA certificates within the resource.
                          type: string
                    protocols:
                      description: |
                        The TLS protocols to allow or deny.
                        Either `allow` or `deny` can be given.
                        The supported protocols are those supported by the proxy JVM.
                      type: object
                      properties:
                        allow:
                          description: |
                            The TLS protocols to allow, ordered by preference.
                            If not specified this defaults to the TLS protocols of the proxy JVM's default SSL context.
                          type: array
                          items:
                            type: string
                        deny:
                          description: |
                            The TLS protocols to deny.
                            If not specified this defaults to the empty list.
                          type: array
                          items:
                            type: string
                          default: []
                    cipherSuites:
                      description: |
                        The TLS cipher suites to allow or deny.
                        Either `allow` or `deny` can be given.
                        The supported cipher suites are those supported by the proxy JVM.
                      type: object
                      properties:
                        allow:
                          description: |
                            The TLS cipher suites to allow.
                            If not specified a default list of ciphers, which depends on the runtime and enabled protocols, will be used.
                          type: array
                          items:
                            type: string
                        deny:
                          description: |
                            The TLS cipher suites to deny
                            If not specified this will default to the empty list.
                          type: array
                          items:
                            type: string
                          default: []
                nodeIdRanges:
                  type: array
                  minItems: 1
                  description: |
                    Declares the ranges of node ids present in the Kafka Cluster this KafkaService refers to. Default 
                    value is a single range starting with node id 0 and ending with 2 inclusive. Note that if you wish
                    to expose this cluster using plain (non-TLS) connections it is desirable to use a compact set of
                    node id ranges, as every node id in every range requires a distinct listening port.
                    See also: https://kafka.apache.org/documentation/#brokerconfigs_node.id
                  items:
                    type: object
                    required: [ "start", "end" ]
                    x-kubernetes-validations:
                      - rule: "self.start <= self.end"
                        message: "end should be greater than or equal to start"
                    properties:
                      name:
                        description: "the name of this node id range"
                        type: string
                        minLength: 1
                      start:
                        description: "The first node id in the range"
                        type: integer
                      end:
                        description: "The last node id in the range, inclusive"
                        type: integer
            status:
              type: object
              properties:
                observedGeneration:
                  description: |
                    The metadata.generation that was observed during the last reconciliation by the operator.
                  type: integer
                tls:
                  type: object
                  description: Reconciled TLS configuration for connections to the Kafka cluster.
                  properties:
                      certificateRef:
                        description: |
                          Reconciled reference to the TLS client certificate resource.
                          This is copied from spec.tls.certificateRef during reconciliation.
                        type: object
                        properties:
                          kind:
                            description: The API kind of the resource containing the TLS client certificate.
                            type: string
                            default: Secret
                          group:
                            description: The API group of the resource containing the TLS client certificate.
                            type: string
                            default: ""
                          name:
                            description: The name of the resource containing the TLS client certificate.
                            type: string
                      trustAnchorRef:
                        type: object
                        description: |
                          Reconciled reference to the TLS trust anchor (CA certificates) resource.
                          This may be auto-discovered from Strimzi or copied from spec.tls.trustAnchorRef.
                        properties:
                          kind:
                            description: The API kind of the resource containing the trusted CA certificates.
                            type: string
                            default: ConfigMap
                          group:

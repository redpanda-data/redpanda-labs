# What this solution needs on a Redpanda Cloud cluster, declared so the
# nightly cloud run can grant exactly that and no more. Delete this file if the
# solution has no "Redpanda Cloud Serverless" tab; the cloud run then skips it.
#
# Keep these in step with the grant the overview page tells a reader to create.
# If they drift, the page is wrong or the test is, and the cloud run is the
# thing that finds out.
#
# topic_prefix   one prefix, matched as a prefix, covering every topic the
#                solution creates. Required.
# consumer_groups  comma separated, read access. Empty if it has none.
topic_prefix=__slug__.
consumer_groups=

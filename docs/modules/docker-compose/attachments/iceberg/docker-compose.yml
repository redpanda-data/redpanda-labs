name: redpanda-iceberg-lab
networks:
  redpanda_network:
    driver: bridge
volumes:
  redpanda-0: null
  rustfs: null
services:
  redpanda-0:
    container_name: redpanda-0
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v25.1.5}
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      # Address the broker advertises to clients that connect to the HTTP Proxy.
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      # Redpanda brokers use the RPC API to communicate with each other internally.
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      # Mode dev-container uses well-known configuration properties for development in containers.
      - --mode dev-container
      # Tells Seastar (the framework Redpanda uses under the hood) to use 1 core on the system.
      - --smp 1
      - --default-log-level=info
      # Enable Tiered Storage (TS)
      - --set redpanda.cloud_storage_enabled=true
      - --set redpanda.cloud_storage_region=local
      - --set redpanda.cloud_storage_access_key=rustfs
      - --set redpanda.cloud_storage_secret_key=rustfs123
      - --set redpanda.cloud_storage_api_endpoint=rustfs
      - --set redpanda.cloud_storage_api_endpoint_port=9000
      - --set redpanda.cloud_storage_disable_tls=true
      - --set redpanda.cloud_storage_bucket=redpanda
      - --set redpanda.cloud_storage_segment_max_upload_interval_sec=30
      # Enable TS by default for topics
      - --set redpanda.cloud_storage_enable_remote_write=true
      - --set redpanda.cloud_storage_enable_remote_read=true
      # Set up Iceberg REST catalog configuration
      - --set redpanda.iceberg_enabled=true
      - --set redpanda.iceberg_catalog_type=rest
      - --set redpanda.iceberg_rest_catalog_endpoint=http://catalog:8181
      # Credentials are required, but the catalog ignores them
      - --set redpanda.iceberg_rest_catalog_client_id=catalog
      - --set redpanda.iceberg_rest_catalog_client_secret=catalog123
      # Too low for production, but makes the lab fast
      - --set redpanda.iceberg_catalog_commit_interval_ms=5000
      - --set redpanda.iceberg_target_lag_ms=10000
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    # Not just rustfs started: Redpanda checks the bucket at startup and
    # aborts if it does not exist yet.
    depends_on:
      createbucket:
        condition: service_completed_successfully
      catalog:
        condition: service_started
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs123
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: local
      # Lets clients address the bucket virtual-host style, as redpanda.rustfs.
      RUSTFS_SERVER_DOMAINS: rustfs
    volumes:
      - rustfs:/data
    networks:
      redpanda_network:
        aliases:
          - redpanda.rustfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Creates the bucket and makes it anonymously readable, then exits. Skips
  # the create when the bucket survives a restart with the volumes kept.
  createbucket:
    depends_on:
      rustfs:
        condition: service_healthy
    image: amazon/aws-cli:2.37.1
    container_name: createbucket
    networks:
      - redpanda_network
    environment:
      - AWS_ACCESS_KEY_ID=rustfs
      - AWS_SECRET_ACCESS_KEY=rustfs123
      - AWS_REGION=local
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket redpanda 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3 mb s3://redpanda &&
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket redpanda --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\",\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::redpanda\",\"arn:aws:s3:::redpanda/*\"]}]}'
      "
  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.0.0}
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 8081:8080
    depends_on:
      - redpanda-0
  catalog:
    image: tabulario/iceberg-rest
    container_name: iceberg-rest
    networks:
      - redpanda_network
    depends_on:
      - rustfs
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=rustfs
      - AWS_SECRET_ACCESS_KEY=rustfs123
      - AWS_REGION=local
      - CATALOG_WAREHOUSE=s3://redpanda/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://rustfs:9000
  # Jupyter with PySpark, from the Jupyter Docker Stacks. The Iceberg jars
  # are fetched from Maven when the first Spark session starts; see
  # spark/spark-defaults.conf.
  spark-iceberg:
    container_name: spark-iceberg
    image: quay.io/jupyter/pyspark-notebook:spark-4.1.2
    command: start-notebook.py --IdentityProvider.token='' --ServerApp.root_dir=/home/jovyan/notebooks
    networks:
      - redpanda_network
    depends_on:
      - rustfs
      - catalog
    environment:
      - AWS_ACCESS_KEY_ID=rustfs
      - AWS_SECRET_ACCESS_KEY=rustfs123
      - AWS_REGION=local
    volumes:
      - ./spark/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
      - ./spark/notebooks:/home/jovyan/notebooks
    ports:
      - 8888:8888
      - 4040:4040

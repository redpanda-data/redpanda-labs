# Sports data feed ingestion and fan-out: local stack.
#
# Start with `make up` (waits for every healthcheck), create the contract with
# `make topics` and `make schemas`, run the feed with `make seed`, prove the
# outcome with `make verify`, tear down with `make clean`. Versions and
# settings come from .env (copied from .env.example on first `make up`). Run
# one stack at a time, or give each its own host ports in .env.
name: sports-data-fanout

# One connection block for every client. The defaults are the local broker;
# .env overrides them for a remote cluster (see "Connection" in .env.example).
x-redpanda-env: &redpanda-env
  REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
  REDPANDA_TLS_ENABLED: ${REDPANDA_TLS_ENABLED:-false}
  REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-}
  REDPANDA_SASL_USERNAME: ${REDPANDA_SASL_USERNAME:-}
  REDPANDA_SASL_PASSWORD: ${REDPANDA_SASL_PASSWORD:-}
  REDPANDA_SCHEMA_REGISTRY_URL: ${REDPANDA_SCHEMA_REGISTRY_URL:-http://redpanda:8081}
  REDPANDA_SCHEMA_REGISTRY_USERNAME: ${REDPANDA_SCHEMA_REGISTRY_USERNAME:-${REDPANDA_SASL_USERNAME:-}}
  REDPANDA_SCHEMA_REGISTRY_PASSWORD: ${REDPANDA_SCHEMA_REGISTRY_PASSWORD:-${REDPANDA_SASL_PASSWORD:-}}

networks:
  redpanda:
    driver: bridge

volumes:
  redpanda-data: {}
  postgres-data: {}

services:
  # tag::redpanda[]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: sports-data-fanout-redpanda
    profiles: ["local"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:${REDPANDA_PROXY_PORT:-18082}
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=info
      # Let sports.market-state roll a segment every minute so compaction is
      # visible during the walkthrough. The cluster default clamps
      # segment.ms to 10 minutes.
      - --set redpanda.log_segment_ms_min=60000
    ports:
      - "${REDPANDA_SR_PORT:-18081}:18081"
      - "${REDPANDA_PROXY_PORT:-18082}:18082"
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::redpanda[]

  # tag::console[]
  console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-latest}
    container_name: sports-data-fanout-console
    profiles: ["local"]
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console-config.yaml:/etc/console/config.yaml:ro
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::console[]

  # tag::rpk[]
  # Helper container so the Makefile, scripts/verify.sh, and the Doc Detective
  # specs can run rpk without a host install: docker compose exec -T rpk rpk ...
  # It also carries the .avsc files that `make schemas` registers.
  rpk:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: sports-data-fanout-rpk
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      RPK_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      RPK_TLS_ENABLED: ${REDPANDA_TLS_ENABLED:-false}
      RPK_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-}
      RPK_USER: ${REDPANDA_SASL_USERNAME:-}
      RPK_PASS: ${REDPANDA_SASL_PASSWORD:-}
      RPK_REGISTRY_HOSTS: ${REDPANDA_SCHEMA_REGISTRY_URL:-http://redpanda:8081}
      RPK_REGISTRY_TLS_ENABLED: ${REDPANDA_TLS_ENABLED:-false}
      RPK_ADMIN_HOSTS: redpanda:9644
    volumes:
      - ./sample-data:/sample-data:ro
      - ./schemas:/schemas:ro
      # Drops empty RPK_* variables before calling the real rpk (see the script).
      - ./scripts/rpk.sh:/usr/local/bin/rpk:ro
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
  # end::rpk[]

  # tag::stores[]
  postgres:
    image: postgres:16-alpine
    container_name: sports-data-fanout-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sports}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
  # end::stores[]

  # tag::feed[]
  # The provider's push feed. One publisher, keyed by fixture.
  feed:
    build:
      context: ./services
      args:
        SERVICE: feed
    container_name: sports-data-fanout-feed
    environment:
      <<: *redpanda-env
      SCHEMA_FILE: ${FEED_SCHEMA_FILE:-/schemas/feed_event.avsc}
      FIXTURES_FILE: ${FIXTURES_FILE:-/sample-data/fixtures.json}
      HTTP_ADDR: ":8080"
      FEED_SEED: ${FEED_SEED:-42}
      FEED_RATE: ${FEED_RATE:-200}
      FEED_EVENTS_PER_FIXTURE: ${FEED_EVENTS_PER_FIXTURE:-250}
      FEED_EVENTS_MAX: ${FEED_EVENTS_MAX:-4000}
      FEED_SUSPEND_EVERY: ${FEED_SUSPEND_EVERY:-11}
      FEED_DROP_EVERY: ${FEED_DROP_EVERY:-0}
      FEED_PROVIDER: ${FEED_PROVIDER:-sportradar}
    volumes:
      - ./schemas:/schemas:ro
      - ./sample-data:/sample-data:ro
    ports:
      - "${FEED_PORT:-8090}:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # end::feed[]

  # tag::consumers[]
  # The three consumers below read the same topic in three different groups.
  # None of them is configured to know about the others, and none of them can
  # slow the others down: that is the whole claim this solution makes.

  # No container_name and no published port, so `docker compose up -d --scale
  # odds-engine=3` can run three members of the group side by side.
  odds-engine:
    build:
      context: ./services
      args:
        SERVICE: odds
    environment:
      <<: *redpanda-env
      ODDS_SCHEMA_FILE: /schemas/odds.avsc
      GROUP: odds-engine
      TOPIC: sports.feed
      OUT_TOPIC: sports.odds
      HTTP_ADDR: ":8080"
    volumes:
      - ./schemas:/schemas:ro
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    # A batch that cannot be published exits the process; the restart replays
    # it from the last committed offset.
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  market-state:
    build:
      context: ./services
      args:
        SERVICE: risk
    container_name: sports-data-fanout-market-state
    environment:
      <<: *redpanda-env
      STATE_SCHEMA_FILE: /schemas/market_state.avsc
      GROUP: market-state
      TOPIC: sports.feed
      OUT_TOPIC: sports.market-state
      HTTP_ADDR: ":8080"
    volumes:
      - ./schemas:/schemas:ro
    ports:
      - "${MARKET_STATE_PORT:-3010}:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The third consumer, with no code in it.
  connect:
    image: docker.redpanda.com/redpandadata/connect:${REDPANDA_CONNECT_VERSION:-latest}
    container_name: sports-data-fanout-connect
    command: ["run", "/connect/feed-archive.yaml"]
    environment:
      <<: *redpanda-env
      # Connect wants a mechanism name and a boolean, so the empty local
      # values become "none" and "false" here.
      REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-none}
      REDPANDA_SCHEMA_REGISTRY_BASIC_AUTH: ${REDPANDA_SASL_USERNAME:+true}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sports}
    volumes:
      - ./connect/feed-archive.yaml:/connect/feed-archive.yaml:ro
    ports:
      - "${CONNECT_PORT:-4195}:4195"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4195/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::consumers[]

# Redpanda Console for the source cluster. Credentials come from the
# KAFKA_SASL_* and SCHEMAREGISTRY_AUTHENTICATION_BASIC_* environment
# variables the compose file sets from .env.
kafka:
  brokers: ["source:9092"]
  sasl:
    enabled: true
    mechanism: SCRAM-SHA-256
schemaRegistry:
  enabled: true
  urls: ["http://source:8081"]
redpanda:
  adminApi:
    enabled: true
    urls: ["http://source:9644"]

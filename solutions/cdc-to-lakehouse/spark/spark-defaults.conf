# Point Spark at the Iceberg REST catalog Redpanda commits to.
#
# Adapted from the Apache Iceberg project's docker-spark-image example
# (spark-defaults.conf, Apache License 2.0). The catalog is renamed to
# `lakehouse`, the S3 endpoint is MinIO, and path-style access is on because
# MinIO here is addressed by host, not by virtual-hosted bucket.
spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type           rest
spark.sql.catalog.lakehouse.uri            http://catalog:8181
spark.sql.catalog.lakehouse.io-impl        org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.warehouse      s3://redpanda/
spark.sql.catalog.lakehouse.s3.endpoint    http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
# Redpanda commits a new snapshot every few seconds, so never serve a cached
# table state: a query must see the change that just happened.
spark.sql.catalog.lakehouse.cache-enabled  false
spark.sql.defaultCatalog                   lakehouse
spark.sql.catalogImplementation            in-memory
# One driver, no cluster, 1 GB. Enough to read a handful of Parquet files.
spark.driver.memory                        1g
spark.driver.maxResultSize                 256m
spark.ui.enabled                           true
spark.ui.port                              4040

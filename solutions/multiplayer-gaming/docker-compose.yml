# Multiplayer Gaming: local stack.
#
# Start with `make up` (waits for every healthcheck), create the contract with
# `make topics` and `make schemas`, seed with `make seed`, prove the outcome
# with `make verify`, tear down with `make clean`. Versions and settings come
# from .env (copied from .env.example on first `make up`). Run one stack at a
# time, or give each its own host ports in .env.
#
# Profiles (COMPOSE_PROFILES in .env):
#   local   the redpanda and console containers; the default. Leave it empty
#           and point REDPANDA_BROKERS at a Redpanda Cloud cluster instead.
#   tiered  MinIO as the object store for the Tiered Storage extension
#           (`make tiered-up`); never needed by the steps or by `make verify`.
name: multiplayer-gaming

# One connection block for every client. The defaults are the local broker;
# .env overrides them for a remote cluster (see "Connection" in .env.example).
x-redpanda-env: &redpanda-env
  REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
  REDPANDA_TLS_ENABLED: ${REDPANDA_TLS_ENABLED:-false}
  REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-}
  REDPANDA_SASL_USERNAME: ${REDPANDA_SASL_USERNAME:-}
  REDPANDA_SASL_PASSWORD: ${REDPANDA_SASL_PASSWORD:-}
  REDPANDA_SCHEMA_REGISTRY_URL: ${REDPANDA_SCHEMA_REGISTRY_URL:-http://redpanda:8081}
  REDPANDA_SCHEMA_REGISTRY_USERNAME: ${REDPANDA_SCHEMA_REGISTRY_USERNAME:-${REDPANDA_SASL_USERNAME:-}}
  REDPANDA_SCHEMA_REGISTRY_PASSWORD: ${REDPANDA_SCHEMA_REGISTRY_PASSWORD:-${REDPANDA_SASL_PASSWORD:-}}

networks:
  redpanda:
    driver: bridge

volumes:
  redpanda-data: {}
  postgres-data: {}
  minio-data: {}

services:
  # tag::redpanda[]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: multiplayer-gaming-redpanda
    profiles: ["local"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:${REDPANDA_PROXY_PORT:-18082}
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=info
      # Let game.leaderboard roll a segment every minute (segment.ms=60000) so
      # compaction is visible during the walkthrough. The cluster default
      # clamps segment.ms to 10 minutes.
      - --set redpanda.log_segment_ms_min=60000
    ports:
      - "${REDPANDA_SR_PORT:-18081}:18081"
      - "${REDPANDA_PROXY_PORT:-18082}:18082"
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::redpanda[]

  # tag::console[]
  console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-latest}
    container_name: multiplayer-gaming-console
    profiles: ["local"]
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console-config.yaml:/etc/console/config.yaml:ro
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::console[]

  # tag::rpk[]
  # Helper container so the Makefile, scripts/verify.sh, and the Doc Detective
  # specs can run rpk without a host install: docker compose exec -T rpk rpk ...
  # It also carries the .proto files that `make schemas` registers. rpk reads
  # the same connection variables as everything else, through its RPK_* names.
  rpk:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: multiplayer-gaming-rpk
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      RPK_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      RPK_TLS_ENABLED: ${REDPANDA_TLS_ENABLED:-false}
      RPK_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-}
      RPK_USER: ${REDPANDA_SASL_USERNAME:-}
      RPK_PASS: ${REDPANDA_SASL_PASSWORD:-}
      RPK_REGISTRY_HOSTS: ${REDPANDA_SCHEMA_REGISTRY_URL:-http://redpanda:8081}
      RPK_REGISTRY_TLS_ENABLED: ${REDPANDA_TLS_ENABLED:-false}
      RPK_ADMIN_HOSTS: redpanda:9644
    volumes:
      - ./sample-data:/sample-data:ro
      - ./proto:/proto:ro
      # Drops empty RPK_* variables before calling the real rpk (see the script).
      - ./scripts/rpk.sh:/usr/local/bin/rpk:ro
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
  # end::rpk[]

  # tag::stores[]
  postgres:
    image: postgres:16-alpine
    container_name: multiplayer-gaming-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
  # end::stores[]

  # tag::connect[]
  connect:
    image: docker.redpanda.com/redpandadata/connect:${REDPANDA_CONNECT_VERSION:-latest}
    container_name: multiplayer-gaming-connect
    command: ["run", "/connect/match-history.yaml"]
    environment:
      <<: *redpanda-env
      # Connect wants a mechanism name and a boolean, so the empty local
      # values become "none" and "false" here.
      REDPANDA_SASL_MECHANISM: ${REDPANDA_SASL_MECHANISM:-none}
      REDPANDA_SCHEMA_REGISTRY_BASIC_AUTH: ${REDPANDA_SASL_USERNAME:+true}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    volumes:
      - ./connect/match-history.yaml:/connect/match-history.yaml:ro
    ports:
      - "${CONNECT_PORT:-4195}:4195"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4195/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::connect[]

  # tag::services[]
  simulator:
    build:
      context: ./services
      args:
        SERVICE: simulator
    container_name: multiplayer-gaming-simulator
    environment:
      <<: *redpanda-env
      SCHEMA_FILE: /proto/game_events.proto
      PLAYERS_FILE: /sample-data/players.json
      HTTP_ADDR: ":8090"
      SIM_SEED: ${SIM_SEED:-42}
      SIM_PLAYERS: ${SIM_PLAYERS:-24}
      SIM_RATE: ${SIM_RATE:-100}
      SIM_MATCH_DURATION: ${SIM_MATCH_DURATION:-60}
      SIM_EVENTS_MAX: ${SIM_EVENTS_MAX:-3000}
      SIM_REGION: ${SIM_REGION:-eu-west}
    volumes:
      - ./proto:/proto:ro
      - ./sample-data:/sample-data:ro
    ports:
      - "${SIMULATOR_PORT:-8090}:8090"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # No container_name and no published port, so `docker compose up -d --scale
  # leaderboard-service=3` can run three members of the group side by side.
  # It reads game.player-events and publishes totals to game.leaderboard; the
  # dashboard below reads that topic on a fixed port.
  leaderboard-service:
    build:
      context: ./services
      args:
        SERVICE: leaderboard
    environment:
      <<: *redpanda-env
      SCHEMA_FILE: /proto/game_events.proto
      GROUP: leaderboard
      TOPIC: game.player-events
      OUT_TOPIC: game.leaderboard
      HTTP_ADDR: ":8080"
    volumes:
      - ./proto:/proto:ro
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    # A batch that cannot be published exits the process; the restart replays
    # it from the last committed offset.
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  leaderboard-dashboard:
    build:
      context: ./services
      args:
        SERVICE: dashboard
    container_name: multiplayer-gaming-leaderboard-dashboard
    environment:
      <<: *redpanda-env
      TOPIC: game.leaderboard
      GROUP: leaderboard
      HTTP_ADDR: ":8080"
    ports:
      - "${LEADERBOARD_PORT:-3000}:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  achievements-service:
    build:
      context: ./services
      args:
        SERVICE: achievements
    container_name: multiplayer-gaming-achievements
    environment:
      <<: *redpanda-env
      SCHEMA_FILE: /proto/game_events.proto
      GROUP: achievements
      TOPIC: game.player-events
      OUT_TOPIC: game.achievements
      HTTP_ADDR: ":8080"
    volumes:
      - ./proto:/proto:ro
    ports:
      - "${ACHIEVEMENTS_PORT:-3010}:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # end::services[]

  # tag::tiered[]
  # Object store for the Tiered Storage extension on the overview page. Only
  # started by `make tiered-up` (profile `tiered`); the steps never need it.
  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-latest}
    container_name: multiplayer-gaming-minio
    profiles: ["tiered"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Creates the bucket once, then exits 0.
  minio-init:
    image: quay.io/minio/mc:${MINIO_MC_VERSION:-latest}
    container_name: multiplayer-gaming-minio-init
    profiles: ["tiered"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$TIERED_BUCKET" && mc ls local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      TIERED_BUCKET: ${TIERED_BUCKET:-redpanda-tiered}
    networks:
      - redpanda
    depends_on:
      minio:
        condition: service_healthy
  # end::tiered[]

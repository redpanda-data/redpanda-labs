# Multiplayer Gaming: local stack.
#
# Start with `make up` (waits for every healthcheck), create the contract with
# `make topics` and `make schemas`, seed with `make seed`, prove the outcome
# with `make verify`, tear down with `make clean`. Versions and settings come
# from .env (copied from .env.example on first `make up`).
name: multiplayer-gaming

networks:
  redpanda:
    driver: bridge

volumes:
  redpanda-data: {}
  postgres-data: {}

services:
  # tag::redpanda[]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: multiplayer-gaming-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::redpanda[]

  # tag::console[]
  console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-latest}
    container_name: multiplayer-gaming-console
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console-config.yaml:/etc/console/config.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::console[]

  # tag::rpk[]
  # Helper container so the Makefile, scripts/verify.sh, and the Doc Detective
  # specs can run rpk without a host install: docker compose exec -T rpk rpk ...
  # It also carries the .proto files that `make schemas` registers.
  rpk:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: multiplayer-gaming-rpk
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      RPK_BROKERS: redpanda:9092
      RPK_ADMIN_HOSTS: redpanda:9644
      RPK_REGISTRY_HOSTS: redpanda:8081
    volumes:
      - ./sample-data:/sample-data:ro
      - ./proto:/proto:ro
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
  # end::rpk[]

  # tag::stores[]
  redis:
    image: redis:7-alpine
    container_name: multiplayer-gaming-redis
    ports:
      - "16379:6379"
    networks:
      - redpanda
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: multiplayer-gaming-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "15432:5432"
    networks:
      - redpanda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
  # end::stores[]

  # tag::connect[]
  connect:
    image: docker.redpanda.com/redpandadata/connect:${REDPANDA_CONNECT_VERSION:-latest}
    container_name: multiplayer-gaming-connect
    command: ["run", "/connect/match-history.yaml"]
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    volumes:
      - ./connect/match-history.yaml:/connect/match-history.yaml:ro
    ports:
      - "4195:4195"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4195/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  # end::connect[]

  # tag::services[]
  simulator:
    build:
      context: ./services
      args:
        SERVICE: simulator
    container_name: multiplayer-gaming-simulator
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      SCHEMA_FILE: /proto/game_events.proto
      PLAYERS_FILE: /sample-data/players.json
      HTTP_ADDR: ":8090"
      SIM_SEED: ${SIM_SEED:-42}
      SIM_PLAYERS: ${SIM_PLAYERS:-24}
      SIM_RATE: ${SIM_RATE:-100}
      SIM_MATCH_DURATION: ${SIM_MATCH_DURATION:-60}
      SIM_EVENTS_MAX: ${SIM_EVENTS_MAX:-3000}
      SIM_REGION: ${SIM_REGION:-eu-west}
    volumes:
      - ./proto:/proto:ro
      - ./sample-data:/sample-data:ro
    ports:
      - "8090:8090"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # No container_name and a port range, so `docker compose up -d --scale
  # leaderboard-service=3` can run three members of the group side by side.
  leaderboard-service:
    build:
      context: ./services
      args:
        SERVICE: leaderboard
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      REDIS_ADDR: redis:6379
      GROUP: leaderboard
      TOPIC: game.player-events
      HTTP_ADDR: ":8080"
      LEADERBOARD_DEDUP: ${LEADERBOARD_DEDUP:-false}
    ports:
      - "3000-3002:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  achievements-service:
    build:
      context: ./services
      args:
        SERVICE: achievements
    container_name: multiplayer-gaming-achievements
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      SCHEMA_FILE: /proto/game_events.proto
      GROUP: achievements
      TOPIC: game.player-events
      OUT_TOPIC: game.achievements
      HTTP_ADDR: ":8080"
    volumes:
      - ./proto:/proto:ro
    ports:
      - "3010:8080"
    networks:
      - redpanda
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # end::services[]

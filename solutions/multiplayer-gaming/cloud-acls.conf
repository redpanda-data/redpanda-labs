# What this solution needs on a Redpanda Cloud cluster, declared so the
# nightly cloud run can grant exactly that and no more.
#
# These are the same grants the overview page tells a reader to create under
# "Redpanda Cloud Serverless": all operations on topics with the prefix
# `game.`, read on the consumer groups `leaderboard`, `achievements` and
# `connect-history`, and describe on the cluster. If they drift apart, either
# the page is wrong or the test is, and the cloud run is what finds out.
topic_prefix=game.
consumer_groups=leaderboard,achievements,connect-history

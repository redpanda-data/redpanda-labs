# Shadow link: Confluent Kafka + Confluent Schema Registry -> Redpanda.
#
# One link carries both halves of the migration: the schemas, through
# API-mode Schema Registry replication, and the topic data that references
# them, through topic metadata sync. `rpk shadow create --config-file` reads
# this file inside the rpk helper container (mounted at /config).
name: schema-registry-migration

# tag::client[]
client_options:
  # The shadow cluster connects to the source broker over the Kafka API.
  bootstrap_servers:
    - confluent-kafka:29092
  tls_settings:
    enabled: false
# end::client[]

# tag::topics[]
topic_metadata_sync_options:
  interval: 10s
  # The three topics the client writes. Literal names; a real migration
  # usually uses PREFIXED or REGEX filters.
  auto_create_shadow_topic_filters:
    - pattern_type: LITERAL
      filter_type: INCLUDE
      name: orders
    - pattern_type: LITERAL
      filter_type: INCLUDE
      name: customers
    - pattern_type: LITERAL
      filter_type: INCLUDE
      name: shipping
  # Replicate the whole history of each topic, not only new records.
  start_at_earliest: {}
# end::topics[]

# tag::registry[]
schema_registry_sync_options:
  # API mode: poll the source registry's REST API and import subjects,
  # versions, and compatibility settings. Topic mode
  # (shadow_schema_registry_topic) copies the _schemas topic byte for byte
  # and only works when the source is another Redpanda cluster.
  shadow_schema_registry_api:
    source_url: http://confluent-schema-registry:8081
    tls_settings:
      enabled: false
    # Incremental poll and full reconciliation intervals. full_sync_interval
    # is lowered from the 5m default so new subjects show up within seconds
    # here; keep the default in production.
    tail_interval: 10s
    full_sync_interval: 20s
    max_source_requests_per_second: 30
    # Every subject in the default context. List contexts or subjects to
    # migrate part of a registry.
    source_filter:
      contexts:
        - "."
      subjects: []
    # Keep the source context names on the shadow cluster.
    destination:
      identity: {}
    # REMOVE strips Confluent-only features (rule sets, metadata tags,
    # compatibility groups) and imports the rest. FAIL, the default, skips
    # such schemas and reports them in the link status.
    unsupported_schema_feature_policy: REMOVE
# end::registry[]
